<title>خزونة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D canvas; HTML layers on top (HUD, bottom sheets, full overlays). Dusk palette, lantern-yellow actions */
:root{
  --bg:#1d3346; --bg-deep:#142636; --panel:#264359; --panel-2:#2f5069;
  --ink:#fbf3e4; --muted:#a9bccb; --line:rgba(251,243,228,.16);
  --lantern:#ffc247; --lantern-ink:#3a2608; --coral:#ff7d6b; --leaf:#7ccf8a;
  --glass:rgba(20,38,54,.72);
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,system-ui,sans-serif;
  --f-body:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 22px;border-radius:18px;
  font-family:var(--f-display);font-size:24px;background:var(--lantern);color:var(--lantern-ink);
  box-shadow:0 5px 0 #c98e1a;transition:transform .08s,box-shadow .08s;width:100%;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c98e1a}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--bg-deep);font-size:20px}
.btn.ghost:active{box-shadow:0 1px 0 var(--bg-deep)}
.row{display:flex;gap:10px;width:100%}
.row>*{flex:1;min-width:0}
.ibtn{width:46px;height:46px;border-radius:14px;background:var(--glass);display:grid;place-items:center;flex:none;backdrop-filter:blur(6px)}
.ibtn svg{width:22px;height:22px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-weight:800;font-size:14px}
.tag.hider{background:rgba(255,125,107,.2);color:var(--coral)}
.tag.seeker{background:rgba(124,207,138,.2);color:var(--leaf)}

/* Full overlays */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;z-index:10;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));box-sizing:border-box;touch-action:pan-y}
.screen.solid{background:var(--bg);background-image:radial-gradient(120% 60% at 85% -10%,rgba(255,194,71,.16),transparent 60%)}
.screen.veil{background:linear-gradient(180deg,rgba(20,38,54,.2) 0%,rgba(20,38,54,.55) 45%,rgba(20,38,54,.94) 75%)}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1;box-sizing:border-box}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.center h1{font-size:clamp(32px,9vw,46px)}
.center p{color:var(--muted);font-size:18px;max-width:32ch}
.logo{font-family:var(--f-display);font-size:clamp(76px,25vw,120px);color:var(--lantern);line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.sub{color:var(--ink);font-size:18px;max-width:30ch;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.card{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.setting>span{font-weight:800}
.seg{display:flex;background:var(--bg-deep);border-radius:14px;padding:4px;gap:4px}
.seg button{min-width:54px;min-height:40px;padding:0 10px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--ink)}
.steps{margin:0;padding:0 22px 0 0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--ink)}
.bar{height:10px;border-radius:10px;background:var(--panel);overflow:hidden;width:min(280px,80%)}
.bar i{display:block;height:100%;width:0;background:var(--lantern);transition:width .2s}

/* Creator */
.ctop{position:fixed;top:0;left:0;right:0;z-index:11;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px))}
.ctitle{text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ctitle h2{font-size:28px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:54%;display:flex;flex-direction:column;
  background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.sheet .scroll{overflow-y:auto;padding-top:16px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;flex:1;min-height:0}
.sheet .foot{padding-top:12px;border-top:1px solid var(--line)}
.sheet .inner{width:100%;max-width:520px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-weight:800;font-size:15px}
input[type=text]{width:100%;box-sizing:border-box;min-height:52px;border-radius:14px;border:2px solid var(--line);
  background:var(--bg-deep);color:var(--ink);font:inherit;font-size:19px;padding:0 14px;user-select:text;-webkit-user-select:text}
input[type=text]:focus{border-color:var(--lantern);outline:none}
.err{color:var(--coral);font-size:14px;font-weight:800}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--panel);font-size:26px;font-weight:800}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:12px;background:var(--panel);font-weight:800;border:2px solid transparent}
.chip.on{border-color:var(--lantern);color:var(--lantern)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--lantern)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint-drag{position:fixed;z-index:11;left:0;right:0;top:46%;text-align:center;font-weight:800;font-size:13px;color:var(--ink);opacity:.7;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}

/* HUD */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.htop{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));pointer-events:none}
.htop>*{pointer-events:auto}
.timer{min-width:96px;text-align:center;background:var(--glass);border-radius:18px;padding:2px 14px 6px;backdrop-filter:blur(6px)}
.timer b{display:block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.1;color:var(--lantern);font-variant-numeric:tabular-nums}
.timer i{display:block;height:5px;border-radius:5px;background:var(--lantern);font-style:normal;transition:width .25s linear}
.timer.hurry b{color:var(--coral);animation:pulse 1s infinite}
.timer.hurry i{background:var(--coral)}
@keyframes pulse{50%{transform:scale(1.1)}}
.tries{background:var(--glass);border-radius:14px;padding:4px 12px;text-align:center;font-weight:800;font-size:12px;color:var(--muted);line-height:1.2;backdrop-filter:blur(6px)}
.tries b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top,0px)) + 92px);
  max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;padding:8px 18px;border-radius:16px;font-weight:800;font-size:17px;
  background:var(--glass);backdrop-filter:blur(6px);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.hot{background:rgba(214,72,52,.85);color:#fff}
.toast.warm{background:rgba(230,160,30,.88);color:#2a1a02}
.toast.cold{background:rgba(52,110,170,.85);color:#fff}
.penalty{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top,0px)) + 50px);font-family:var(--f-display);font-size:30px;color:var(--coral);
  transform:translateX(30px);animation:rise .9s forwards;pointer-events:none}
@keyframes rise{to{transform:translate(30px,-30px);opacity:0}}
#joy{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 6px);
  width:136px;height:136px;border-radius:50%;background:rgba(20,38,54,.45);border:3px solid rgba(251,243,228,.35);touch-action:none;backdrop-filter:blur(3px)}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 -4px 0 rgba(0,0,0,.15)}
#actWrap{position:absolute;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 6px);
  display:flex;flex-direction:column;align-items:center;gap:8px}
#act{width:104px;height:104px;border-radius:50%;background:var(--lantern);color:var(--lantern-ink);font-family:var(--f-display);font-size:24px;
  box-shadow:0 6px 0 #c98e1a,0 8px 20px rgba(0,0,0,.4);touch-action:manipulation}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 #c98e1a}
#act.done{background:var(--panel);color:var(--muted);box-shadow:0 6px 0 var(--bg-deep)}
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.radar{background:var(--glass);border:2px solid var(--leaf);color:var(--leaf);border-radius:14px;padding:2px 10px;font-weight:800;font-size:14px;line-height:1.2;backdrop-filter:blur(6px)}
.radar small{display:block;font-size:11px;color:var(--muted)}
.radar[disabled]{opacity:.35;border-color:var(--muted);color:var(--muted)}
.spotname{background:var(--glass);padding:2px 12px;border-radius:12px;font-weight:800;font-size:14px;white-space:nowrap;backdrop-filter:blur(6px)}
.roleline{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 150px);pointer-events:none;white-space:nowrap}
.helpline{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom,0px));font-size:12px;font-weight:700;
  color:var(--ink);opacity:.75;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}

.modal{position:fixed;inset:0;z-index:20;background:rgba(20,38,54,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .box{width:100%;max-width:520px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:20px;
  padding-bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;text-align:center;box-sizing:border-box}
.modal h2{font-size:30px}
.modal p{color:var(--muted)}
.count{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(20,38,54,.55);pointer-events:none}
.count b{font-family:var(--f-display);font-weight:400;font-size:170px;color:var(--lantern);text-shadow:0 8px 0 rgba(0,0,0,.3);animation:pop .6s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.score .p{display:flex;flex-direction:column;align-items:center;min-width:0;font-weight:800}
.score .p span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .p small{color:var(--muted);font-weight:700}
.score .num{font-family:var(--f-display);font-size:46px;font-variant-numeric:tabular-nums;display:flex;gap:10px;color:var(--lantern)}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;background:var(--panel);border-radius:16px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:13px;font-weight:800}
.eye{width:96px;height:96px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="c" aria-label="عالم اللعبة"></canvas>
<div id="hud" hidden dir="rtl">
  <div class="htop pad">
    <button class="ibtn" id="quitBtn" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="timer" id="timerBox"><b id="clk">90</b><i id="tbar" style="width:100%"></i></div>
    <div class="side"><div class="tries" id="triesBox">محاولات<b id="tries">0</b></div><button class="radar" id="radarBtn">رادار<small>−10 ث</small></button></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="roleline" id="roleline"></div>
  <div id="joy" aria-label="عجلة التحريك"><div id="knob"></div></div>
  <div id="actWrap" hidden><div class="spotname" id="spotName"></div><button id="act">ابحث</button></div>
  <div class="helpline" id="helpline">حرّك بالعجلة · اسحب الشاشة لتدوير الكاميرا</div>
</div>
<div id="ui" dir="rtl" lang="ar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=id=>document.getElementById(id);
const ui=$('ui'),hud=$('hud');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ============ Game state ============ */
const G={mode:'loading',players:[null,null],objs:[null,null],hider:0,round:1,score:[0,0],duration:90,hints:true,sound:true,hide:null,night:false};

/* ============ Sound ============ */
let actx=null;
function sound(freqs,dur=.12,type='sine',gap=.09,vol=.16,pan=0){
  if(!G.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      const t=actx.currentTime+i*gap;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.002,vol),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      let out=g;if(pan&&actx.createStereoPanner){const pn=actx.createStereoPanner();pn.pan.value=pan;g.connect(pn);out=pn;}
      o.connect(g);out.connect(actx.destination);o.start(t);o.stop(t+dur+.02);});}catch(e){}
}
/* The hider giggles: louder when close, panned toward the hider relative to the camera */
function giggle(ch,h,dist){const dx=h.x-ch.root.position.x,dz=h.z-ch.root.position.z,l=Math.hypot(dx,dz)||1;
  const rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);
  const side=(dx*rx+dz*rz)/l,front=(dx*fx+dz*fz)/l,vol=clamp(.32-dist/90,.03,.3);
  sound([1180,980,1250,1020,1300],.09,'triangle',.11,vol,clamp(side,-1,1));
  const dir=Math.abs(side)>.45?(side>0?'من جهة اليمين':'من جهة اليسار'):(front>0?'من الأمام':'من الخلف');
  const how=dist<8?'قريبة جداً':dist<16?'ليست بعيدة':'بعيدة';
  showToast(`سمعت ضحكة ${how} ${dir}`,dist<8?'hot':dist<16?'warm':'cold',3000);}
let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');}else if(!on&&wake){await wake.release();wake=null;}}catch(e){}}

/* ============ Renderer ============ */
const canvas=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){ui.innerHTML='<div class="screen solid pad"><div class="center"><h1>المتصفح لا يدعم ثلاثي الأبعاد</h1><p>افتح اللعبة في Chrome على الهاتف.</p></div></div>';throw e;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const matCache={};
const M=(hex,o={})=>{const k=hex+JSON.stringify(o);return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:C(hex),roughness:.85,metalness:0},o)));};

const world=new THREE.Scene();
const SKY='#f3b98a';
world.background=C(SKY);world.fog=new THREE.Fog(C(SKY),38,95);
const camera=new THREE.PerspectiveCamera(55,1,.1,200);
const studio=new THREE.Scene();studio.background=C('#1d3346');
const scam=new THREE.PerspectiveCamera(32,1,.1,50);

function frameStudio(){const w=innerWidth,h=innerHeight,R=1.85,vis=.36,cy=.27; // fixed scale so age shows as height; body sits between title and sheet
  const fh=R*1.12/vis,d=fh/(2*Math.tan(THREE.MathUtils.degToRad(scam.fov/2)));
  scam.position.set(0,R*.5,d);scam.lookAt(0,R*.5,0);scam.setViewOffset(w,h,0,h*(.5-cy),w,h);scam.updateProjectionMatrix();G.studioH=1;}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();scam.aspect=w/h;scam.updateProjectionMatrix();if(G.studioH)frameStudio();}
addEventListener('resize',resize);resize();

/* ============ Lights ============ */
const hemi=new THREE.HemisphereLight(C('#ffe9cf'),C('#4f7a46'),.75);world.add(hemi);
const sun=new THREE.DirectionalLight(C('#fff1d6'),1.25);
sun.position.set(-18,30,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:5,far:80});sun.shadow.bias=-.0008;
world.add(sun);
const LAMPS=[],BULBS=[];
const flash=new THREE.SpotLight(C('#fff4d8'),0,18,.5,.55,1.2);flash.position.set(0,1.25,.25);flash.target.position.set(0,.2,5);world.add(flash);world.add(flash.target);
const moon=new THREE.Mesh(new THREE.SphereGeometry(4,20,12),new THREE.MeshBasicMaterial({color:C('#f4f1dc'),fog:false}));moon.position.set(-50,45,-70);moon.visible=false;world.add(moon);
function lamp(x,y,z,col,int,dist){const l=new THREE.PointLight(C(col),0,dist,1.6);l.position.set(x,y,z);l.userData.on=int;world.add(l);LAMPS.push(l);
  const b=new THREE.Mesh(new THREE.SphereGeometry(.14,12,8),new THREE.MeshStandardMaterial({color:C('#fff3c4'),emissive:C('#ffd27a'),emissiveIntensity:0}));b.position.set(x,y,z);world.add(b);BULBS.push(b);}
function applyTime(){const n=G.night;const bg=C(n?'#0f1a2c':SKY);world.background=bg;world.fog.color=bg;world.fog.near=n?14:38;world.fog.far=n?55:95;
  hemi.intensity=n?.2:.75;sun.intensity=n?.22:1.25;sun.color=C(n?'#9fb7ff':'#fff1d6');moon.visible=n;
  LAMPS.forEach(l=>l.intensity=n?l.userData.on:0);BULBS.forEach(b=>b.material.emissiveIntensity=n?1.4:0);flash.intensity=n?2.6:0;}

function box(w,h,d,color,x,y,z,o={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),o.mat||M(color,o.m||{}));m.position.set(x,y,z);

function cyl(rt,rb,h,color,x,y,z,seg=16,o={}){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),o.mat||M(color,o.m||{}));m.position.set(x,y,z);m.castShadow=o.cast!==false;m.receiveShadow=true;world.add(m);return m;}

function addColl(x,z,w,d){COLL.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});}

function wall(x1,z1,x2,z2,gaps,color='#f4e6cf'){
  const H=2.8,T=.22,horiz=z1===z2;const a=horiz?x1:z1,b=horiz?x2:z2;
  const cuts=[a,...(gaps||[]).flat(),b];
  for(let i=0;i<cuts.length;i+=2){const s=cuts[i],e=cuts[i+1];if(e-s<.01)continue;const L=e-s,mid=(s+e)/2;
    const mat=new THREE.MeshStandardMaterial({color:C(color),roughness:.9,transparent:true,opacity:1});
    const m=horiz?box(L,H,T,null,mid,H/2,z1,{mat,coll:true}):box(T,H,L,null,x1,H/2,mid,{mat,coll:true});FADERS.push(m);}
  (gaps||[]).forEach(([s,e])=>{const L=e-s,mid=(s+e)/2;const mat=M('#8a5a3b');  // lintel above doorway
    const m=horiz?box(L,.5,T,null,mid,H-.25,z1,{mat}):box(T,.5,L,null,x1,H-.25,mid,{mat});});
}

/* Bake a clip from the robot rig onto another Mixamo rig with different bone orientations:

async function fetchBuf(url,onP){const r=await fetch(url);if(!r.ok)throw new Error(url+' '+r.status);

  const rd=r.body.getReader();const parts=[];let got=0;for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onP(Math.min(1,got/total));}

  FADERS.forEach(m=>m.material.opacity+=((1)-m.material.opacity)*Math.min(1,dt*8));
  const dir=cam.target.clone().sub(camera.position);const len=dir.length();ray.set(camera.position,dir.normalize());ray.far=len-.3;
  ray.intersectObjects(FADERS,false).forEach(hit=>{hit.object.material.opacity=Math.min(hit.object.material.opacity,.22);});
}

/* ---- Search phase ---- */
function search(){
  const k=1-G.hider,o=G.objs[k];G.mode='search';G.lock=false;G.tries=0;
  const total=G.duration*1000;G.endAt=performance.now()+total;G.startAt=performance.now();G.total=total;G.lastSec=null;
  setHud(true);$('timerBox').hidden=false;$('triesBox').hidden=false;$('tries').textContent='0';$('radarBtn').hidden=false;$('radarBtn').disabled=false;
  G.nextGiggle=performance.now()+12000;G.nextBeat=0;
  $('radarBtn').onclick=()=>{if(G.mode!=='search')return;$('radarBtn').disabled=true;G.endAt-=10000;const h=SPOTS.find(x=>x.id===G.hide),house=inHouse(h.x,h.z);
    sound([880,1320,880,1320],.08,'sine',.07);
    const side=house?(h.x<0?(h.z<-9?'غرفة النوم':'الصالون'):(h.z<-9?'الحمّام':'المطبخ')):(h.z<-4?'الجهة الخلفية من الحديقة':'الجهة الأمامية من الحديقة');
    showToast(`الرادار: ${house?'في البيت':'في الحديقة'} · ${side}`,'warm',4500);
    SPOTS.forEach(sp=>{if(!sp.checked&&inHouse(sp.x,sp.z)!==house){sp.dim=true;}});};
  $('roleline').innerHTML=`<span class="tag seeker">${esc(G.players[k].name)} ${vb(k,'يبحث','تبحث')}</span>`;
  showToast(G.hints?'التلميح يظهر بعد كل محاولة':'ابدأ البحث!','',2500);
  keepAwake(true);
  $('act').textContent='ابحث';
  $('act').onclick=()=>{const s=G.near;if(!s||G.mode!=='search')return;
    if(s.checked){showToast('بحثت هنا من قبل','',1400);return;}
    G.tries++;$('tries').textContent=G.tries;
    if(s.id===G.hide){reveal(true);return;}
    s.checked=true;s.ring.material.color=C('#ff7d6b');s.ring.material.opacity=.9;G.endAt-=3000;
    const pe=document.createElement('div');pe.className='penalty';pe.textContent='−3';hud.appendChild(pe);setTimeout(()=>pe.remove(),900);
    sound([240,180],.12,'square');
    if(G.hints){const h=SPOTS.find(x=>x.id===G.hide);const d=Math.hypot(s.x-h.x,s.z-h.z);
      const sameArea=inHouse(s.x,s.z)===inHouse(h.x,h.z);
      if(d<5)showToast('سخون! قريب بزاف','hot');else if(d<10)showToast('دافي… قرّبت','warm');

    else showToast('ماكانش هنا!','',1500);
    $('act').className='done';};
  $('quitBtn').onclick=quitMenu;
}
function reveal(found){
  const k=1-G.hider,seeker=G.objs[k],hid=G.objs[G.hider],s=SPOTS.find(x=>x.id===G.hide);
  G.mode='found';G.lock=true;keepAwake(false);setHud(false);$('toast').hidden=true;

  else hid.root.rotation.y=Math.atan2(-s.x,15-s.z);
  hid.play('idle');seeker.play('idle');
  G.found={x:s.x,z:s.z};G.orbitObj=hid;cam.yaw=Math.atan2(sp.x-s.x,sp.z-s.z);
  const winner=found?k:G.hider;G.score[winner]++;
  if(found)sound([523,659,784,1047],.18,'triangle',.1);else sound([392,330,262],.25,'sawtooth',.18);
  setTimeout(()=>result(found,elapsed),1600);
}

/* ============ Main loop ============ */
const clock=new THREE.Clock();let menuYaw=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  if(G.mode==='loading'||G.mode==='pass')return;
  if(G.mode==='create'){
    if(G.preview){G.preview.mixer.update(dt);G.spinPause=Math.max(0,(G.spinPause||0)-dt);if(!G.spinPause)G.preview.root.rotation.y+=dt*.5;updateFollowers(G.preview);}
    renderer.render(studio,scam);return;}
  G.objs.forEach(o=>{if(!o)return;o.mixer.update(dt);updateFollowers(o);});
  if(G.mode==='menu'){menuYaw+=dt*.08;cam.yaw=menuYaw;cam.pitch=.38;cam.dist=30;const t=new THREE.Vector3(0,1,-4);cam.target.copy(t);
    camera.position.set(Math.sin(menuYaw)*30,13,-4+Math.cos(menuYaw)*30);camera.lookAt(0,1,-4);G.roof.forEach(r=>r.visible=true);
    FADERS.forEach(m=>m.material.opacity=1);renderer.render(world,camera);return;}
  if(G.mode==='found'||G.mode==='result'){cam.yaw+=dt*.25;const o=G.orbitObj;updateCamera(o,dt,true);renderer.render(world,camera);return;}
  const ch=G.active;
  if(G.mode==='hide'||G.mode==='search'){controlPlayer(ch,dt);
    const s=nearestSpot(ch.root.position);G.near=s;
    $('actWrap').hidden=!s;if(s){$('spotName').textContent=s.label;
      if(G.mode==='search')$('act').className=s.checked?'done':'';}
    const pulse=.55+Math.sin(performance.now()/300)*.2;
    SPOTS.forEach(sp=>{if(!sp.checked)sp.ring.material.opacity=sp===s?.95:pulse*(G.mode==='hide'?1.2:(sp.dim?.25:.8));});
  }
  if(G.mode==='hide'){
    const left=Math.max(0,G.hideEnd-performance.now()),sec=Math.ceil(left/1000);
    $('clk').textContent=sec;$('tbar').style.width=(left/G.hideTotal*100)+'%';$('timerBox').classList.toggle('hurry',sec<=10);
    if(sec!==G.lastSec&&sec<=10&&sec>0)sound([sec<=3?990:740],.07,'triangle');G.lastSec=sec;
    if(left<=0){const p=ch.root.position;let best=SPOTS[0],bd=1e9;SPOTS.forEach(sp=>{const d=Math.hypot(p.x-sp.x,p.z-sp.z);if(d<bd){bd=d;best=sp;}});G.doHide(best);return;}
  }
  if(G.mode==='search'){
    const now=performance.now(),hs=SPOTS.find(x=>x.id===G.hide),dist=Math.hypot(ch.root.position.x-hs.x,ch.root.position.z-hs.z);
    if(now>G.nextGiggle){G.nextGiggle=now+16000;giggle(ch,hs,dist);}
    if(G.hints&&dist<5&&now>G.nextBeat){sound([62,55],.12,'sine',.16,.5);G.nextBeat=now+250+dist*220;}
    const left=Math.max(0,G.endAt-performance.now()),sec=Math.ceil(left/1000);
    $('clk').textContent=sec;$('tbar').style.width=(left/G.total*100)+'%';$('timerBox').classList.toggle('hurry',sec<=10);
    if(sec!==G.lastSec&&sec<=10&&sec>0)sound([sec<=3?990:740],.07,'triangle');G.lastSec=sec;
    if(left<=0)reveal(false);
  }
  updateCamera(ch,dt,false);
  renderer.render(world,camera);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G.mode==='search')keepAwake(true);});
loadAll().catch(e=>{console.error(e);ui.innerHTML=`<div class="screen solid pad"><div class="center"><h1>تعذّر تحميل اللعبة</h1><p>تحقّق من الاتصال بالإنترنت ثم أعد فتح الصفحة.</p></div></div>`;});
loop();
</script>
